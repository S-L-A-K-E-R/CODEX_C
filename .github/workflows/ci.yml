name: Validate CODEX C
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run runtime:fetch
      - run: npm test
      - run: npm run test:curriculum
      - run: npm run test:runtime
      - run: npm run build
