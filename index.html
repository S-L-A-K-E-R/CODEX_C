<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101719" />
    <meta
      name="description"
      content="Learn C one small challenge at a time. A guided learning path, a real C workspace, and progress that belongs to you."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>CODEX C — Make it compile. Make it yours.</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Works even when a cached or missing JavaScript bundle prevents React from starting. -->
    <div id="boot-recovery" hidden role="alert" style="max-width:540px;margin:10vh auto;padding:24px;border:1px solid #ccd8df;border-radius:12px;background:#f7fafc;color:#1c3142;font:16px/1.6 system-ui,sans-serif;">
      <h1 style="font-size:24px;margin:0 0 12px;">CODEX C couldn't load</h1>
      <p style="margin:0 0 14px;">The page may be using an outdated cached version. Your saved progress is not affected.</p>
      <button id="boot-retry" type="button" style="border:0;border-radius:8px;padding:11px 18px;background:#00599c;color:white;font:inherit;cursor:pointer;">Reload the latest version</button>
    </div>
    <script>
      (function () {
        var root = document.getElementById("root");
        var recovery = document.getElementById("boot-recovery");
        function showRecovery() {
          if (root && root.children.length === 0) recovery.hidden = false;
        }
        document.getElementById("boot-retry").addEventListener("click", function () {
          var address = new URL(window.location.href);
          address.searchParams.set("refresh", String(Date.now()));
          window.location.replace(address.toString());
        });
        window.addEventListener("error", function (event) {
          if (event.target && event.target.tagName === "SCRIPT") showRecovery();
        }, true);
        window.addEventListener("unhandledrejection", function () {
          window.setTimeout(showRecovery, 100);
        });
        window.setTimeout(showRecovery, 8000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
